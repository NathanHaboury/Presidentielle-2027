lang: fr
language:
  title-block-author-single: "Auteur"
  title-block-published: "Version du"
filters:
  - edition/livre/filtres/livre.lua
  - edition/livre/filtres/notes.lua
number-sections: false

format:
  html:
    from: markdown+lists_without_preceding_blankline+autolink_bare_uris-blank_before_header-blank_before_blockquote
    theme: cosmo
    toc-depth: 3
    # Largeur des colonnes du site : menu à gauche, texte, table des matières à droite.
    grid:
      sidebar-width: 280px
      body-width: 1150px
      margin-width: 260px
      gutter-width: 2rem
  typst:
    from: markdown+lists_without_preceding_blankline+autolink_bare_uris-blank_before_header-blank_before_blockquote
    papersize: a4
    toc-depth: 1
    template-partials:
      - edition/livre/typst/typst-show.typ
    include-in-header:
      - text: |
          #show table: set par(justify: false)
          #show table: set text(size: 8pt)
    include-before-body:
      - text: |
          // Les dossiers numérotent eux-mêmes leurs sections (1., 1.1…) :
          // seuls les chapitres reçoivent un numéro automatique.
          #set heading(numbering: (..nums) => {
            let v = nums.pos()
            if v.len() == 1 { numbering("1.", ..v) }
          })
          // En-tête de page : le titre du chapitre, sans numéro de section.
          #set page(header: context {
            let p = here().page()
            let starts = query(heading.where(level: 1)).filter(h => h.location().page() == p)
            if starts.len() > 0 { return none }
            let before = query(heading.where(level: 1).before(here()))
            if before.len() == 0 { return none }
            set text(size: 8pt)
            let t = before.last().body
            if calc.even(p) { [#counter(page).display() #h(1fr) #t] } else { [#t #h(1fr) #counter(page).display()] }
            v(-4pt)
            line(length: 100%, stroke: 0.4pt)
          })
